name: Build iOS Mod Menu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos iOS Environment
        uses: youngdynasty/theos-action@v1
        with:
          theos-ref: master

      - name: Compile dylib Binary
        run: |
          cd ImGui-AdvancedModMenu/ImGui-ModMenu
          make package FINALPACKAGE=1
