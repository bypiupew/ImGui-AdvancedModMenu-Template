steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Theos
    uses: Randomblock1/theos-action@v1

  - name: Find project and diagnose headers
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Repository root ==="
      pwd

      echo "=== Makefiles ==="
      find . -name Makefile -not -path '*/.theos/*' -print

      echo "=== ImGui headers ==="
      find . -type f -name imgui.h -print

      echo "=== Conflicting initializer_list files ==="
      find . -type f -path '*/IMGUI/initializer_list' -print

      PROJECT_MAKEFILE="$(find . -type f -name Makefile \
        -not -path '*/.theos/*' \
        -not -path '*/.git/*' \
        -print -quit)"

      if [ -z "$PROJECT_MAKEFILE" ]; then
        echo "ERROR: No project Makefile found."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$PROJECT_MAKEFILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Using project directory: $PROJECT_DIR"

  - name: Remove conflicting ImGui header
    shell: bash
    run: |
      set -euo pipefail

      find "$PROJECT_DIR" -type f \
        -path '*/IMGUI/initializer_list' -print -delete

      if find "$PROJECT_DIR" -type f \
        -path '*/IMGUI/initializer_list' -print -quit | grep -q .; then
        echo "ERROR: Conflicting initializer_list file remains."
        exit 1
      fi

  - name: Build package
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      make clean
      make package FINALPACKAGE=1

  - name: Upload Debian package
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: ImGui-ModMenu-package
      path: "**/*.deb"
      if-no-files-found: warn
