
name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS14.5.sdk" "$HOME/theos/sdks/"

      - name: Check Project Directory
        run: |
          ls -la
          ls -la ImGui-AdvancedModMenu/ImGui-ModMenu

      - name: Compile Tweak
        run: |
          cd ImGui-AdvancedModMenu/ImGui-ModMenu
          make clean package FINALPACKAGE=1
