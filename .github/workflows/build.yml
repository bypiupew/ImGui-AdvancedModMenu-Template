
name: Build ImGui-ModMenu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          clang --version

      - name: Install dependencies
        run: |
          brew update
          brew install make ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"

      - name: Verify project structure
        working-directory: ImGui-Advanced-ModMenu/ImGui-ModMenu
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Makefile ==="
          test -f Makefile || {
            echo "ERROR: Makefile not found"
            exit 1
          }

          echo "=== ImGui header search ==="
          find . -iname "imgui.h" -print

          echo "=== Expected ImGui directory ==="
          ls -la IMGUI || true

          echo "=== Menu directory ==="
          ls -la Menu || true

          echo "=== CheatFeatures header ==="
          if [ -f Menu/CheatFeatures.hpp ]; then
            sed -n '1,35p' Menu/CheatFeatures.hpp
          else
            echo "Menu/CheatFeatures.hpp not found"
          fi

       - name: Diagnose ImGui include
        run: |
          echo "=== Repository root ==="
          pwd

          echo "=== All imgui.h files ==="
          find . -type f -iname 'imgui.h' -print

          echo "=== CheatFeatures include ==="
          grep -n '#include.*imgui' \
            ImGui-Advanced-ModMenu/ImGui-ModMenu/Menu/CheatFeatures.hpp

          echo "=== Makefile include flags ==="
          grep -nE 'CFLAGS|CCFLAGS|IMGUI' \
            ImGui-Advanced-ModMenu/ImGui-ModMenu/Makefile


      - name: Verify ImGui header
        working-directory: ImGui-Advanced-ModMenu/ImGui-ModMenu
        run: |
          if [ ! -f IMGUI/imgui.h ]; then
            echo "ERROR: IMGUI/imgui.h does not exist at the expected path."
            echo "Use the previous step's find output to locate it."
            exit 1
          fi

          echo "Found IMGUI/imgui.h"

      - name: Build package
        working-directory: ImGui-Advanced-ModMenu/ImGui-ModMenu
        run: |
          set -o pipefail

          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theos-build-log
          path: ImGui-Advanced-ModMenu/ImGui-ModMenu/build.log
          if-no-files-found: ignore

      - name: Upload Debian package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImGui-ModMenu-package
          path: |
            ImGui-Advanced-ModMenu/ImGui-ModMenu/packages/*.deb
          if-no-files-found: warn
