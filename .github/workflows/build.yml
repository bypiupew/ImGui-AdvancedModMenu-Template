name: Build iOS Mod Menu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Core Compiler and Patched SDKs
        run: |
          git clone --recursive https://github.com ~/theos
          mkdir -p ~/theos/sdks
          curl -LO https://github.com
          tar -xJf iPhoneOS14.5.sdk.tar.xz -C ~/theos/sdks/
          rm -rf iPhoneOS14.5.sdk.tar.xz
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Compile Tweak Binary
        run: |
          export THEOS=~/theos
          cd ImGui-AdvancedModMenu/ImGui-ModMenu
          $THEOS/bin/make package FINALPACKAGE=1
