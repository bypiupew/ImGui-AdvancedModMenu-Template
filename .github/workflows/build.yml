
name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          brew install ldid xz

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/sdks"

          SDK_SOURCE="$RUNNER_TEMP/sdks"
          SDK_NAME="iPhoneOS16.5.sdk"

          if [ ! -d "$SDK_SOURCE/$SDK_NAME" ]; then
            echo "ERROR: $SDK_NAME was not found."
            find "$SDK_SOURCE" -maxdepth 1 \
              -type d -name 'iPhoneOS*.sdk'
            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          cp -R "$SDK_SOURCE/$SDK_NAME" "$THEOS/sdks/"

          echo "SDK installed:"
          ls -ld "$THEOS/sdks/$SDK_NAME"

      - name: Check Project and Source Files
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"

          if [ ! -f "$PROJECT_DIR/Makefile" ]; then
            echo "ERROR: Makefile not found at $PROJECT_DIR"
            echo "Repository root:"
            ls -la
            exit 1
          fi

          echo "=== Project files ==="
          ls -la "$PROJECT_DIR"

          echo "=== Source directories ==="
          find "$PROJECT_DIR" -maxdepth 2 \
            -type f \( -name 'Set.mm' -o -name 'Set.hpp' \) \
            -print

          echo "=== Check Set.mm for misplaced hook code ==="
          grep -nE \
            'substrate\.h|mach-o/dyld\.h|WeaponSpreadCalc|MSHookFunction' \
            "$PROJECT_DIR/menu/Set.mm" || true

          echo "=== Last 20 lines of Set.mm ==="
          tail -n 20 "$PROJECT_DIR/menu/Set.mm"

      - name: Build Theos Tweak
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"

          cd "$PROJECT_DIR"

          echo "=== Clean ==="
          make clean

          echo "=== Build using iOS SDK 16.5 ==="
          make package FINALPACKAGE=1 SDKVERSION=16.5

      - name: Locate Build Outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"

          echo "=== Generated packages and libraries ==="

          find "$PROJECT_DIR/.theos" \
            "$PROJECT_DIR/packages" \
            -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -print 2>/dev/null || true

      - name: Collect Build Artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"
          ARTIFACT_DIR="$RUNNER_TEMP/artifacts"

          mkdir -p "$ARTIFACT_DIR"

          find "$PROJECT_DIR/.theos" \
            "$PROJECT_DIR/packages" \
            -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -exec cp -f {} "$ARTIFACT_DIR/" \; \
            2>/dev/null || true

          if [ -z "$(find "$ARTIFACT_DIR" \
            -type f -print -quit)" ]; then
            echo "ERROR: No build artifacts found."
            exit 1
          fi

          ls -lh "$ARTIFACT_DIR"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ModMenu-Build
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 7
