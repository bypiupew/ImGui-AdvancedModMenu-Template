name: Build ImGui-ModMenu

on: push: branches: - main pull_request: branches: - main workflow_dispatch:

permissions: contents: read

jobs: build: name: Build iOS Tweak runs-on: macos-15

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Theos
    uses: Randomblock1/theos-action@v1

  - name: Diagnose project structure
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Repository root ==="
      pwd

      echo "=== Available Makefiles ==="
      find . -name Makefile \
        -not -path '*/.theos/*' \
        -not -path '*/.git/*' -print

      echo "=== ImGui headers ==="
      find . -type f -name imgui.h -print

      echo "=== initializer_list files ==="
      find . -type f -name initializer_list -print

      PROJECT_MAKEFILE="$(find . -type f -name Makefile \
        -not -path '*/.theos/*' \
        -not -path '*/.git/*' -print -quit)"

      if [ -z "$PROJECT_MAKEFILE" ]; then
        echo "ERROR: No Makefile found."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$PROJECT_MAKEFILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Selected project: $PROJECT_DIR"

  - name: Verify ImGui header conflict
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Inspect project-local initializer_list ==="

      find "$PROJECT_DIR" -type f \
        -path '*/IMGUI/initializer_list' -print

      if [ -f "$PROJECT_DIR/IMGUI/initializer_list" ]; then
        echo "Found conflicting project-local header."
        sed -n '1,60p' "$PROJECT_DIR/IMGUI/initializer_list"
        echo "Removing the conflicting file."
        rm "$PROJECT_DIR/IMGUI/initializer_list"
      fi

      echo "=== Verify expected header ==="
      if [ ! -f "$PROJECT_DIR/IMGUI/imgui.h" ]; then
        echo "ERROR: IMGUI/imgui.h not found in selected project."
        exit 1
      fi

  - name: Build Debian package
    shell: bash
    run: |
      set -euo pipefail

      cd "$PROJECT_DIR"

      echo "=== Clean previous build ==="
      make clean

      echo "=== Compile and package ==="
      make package FINALPACKAGE=1

  - name: Upload Debian packages
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: ImGui-ModMenu-deb
      path: "**/*.deb"
      if-no-files-found: error
