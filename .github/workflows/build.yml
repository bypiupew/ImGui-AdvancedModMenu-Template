name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          SDK_NAME="iPhoneOS16.5.sdk"
          if [ ! -d "$RUNNER_TEMP/sdks/$SDK_NAME" ]; then
            echo "ERROR: $SDK_NAME not found"
            find "$RUNNER_TEMP/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk'
            exit 1
          fi
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdks/$SDK_NAME" "$THEOS/sdks/"

      - name: Show what the runner is building
        shell: bash
        run: |
          cd ImGui-Advanced-ModMenu/ImGui-ModMenu
          echo "=== Commit being built ==="
          git log -1 --oneline
          echo "=== Where the toggle variables appear ==="
          grep -rnE 'NoSpreadActive|GodModeActive' . \
            --include='*.mm' --include='*.hpp' --include='*.h' --include='*.cpp' || true

      - name: Build Theos Tweak
        shell: bash
        run: |
          set -euo pipefail
          cd ImGui-Advanced-ModMenu/ImGui-ModMenu
          make clean
          make package FINALPACKAGE=1 SDKVERSION=16.5 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show first errors
        if: failure()
        shell: bash
        run: |
          echo "=== First errors ==="
          grep -nE 'error:|Undefined symbols|duplicate symbol' "$RUNNER_TEMP/build.log" | head -n 15 || true

      - name: Collect Build Artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"
          ARTIFACT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$ARTIFACT_DIR"
          find "$PROJECT_DIR/.theos" "$PROJECT_DIR/packages" -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -exec cp -f {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
          if [ -z "$(find "$ARTIFACT_DIR" -type f -print -quit)" ]; then
            echo "ERROR: No build artifacts found."
            exit 1
          fi
          ls -lh "$ARTIFACT_DIR"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ModMenu-Build
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 7
