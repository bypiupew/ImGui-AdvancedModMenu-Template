name: Build iOS Mod Menu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiler Environment
        run: |
          git clone --recursive https://github.com ~/theos
          mkdir -p ~/theos/sdks
          curl -LO https://github.com
          unzip -q iPhoneOS14.5.sdk.zip -d ~/theos/sdks/
          rm -rf iPhoneOS14.5.sdk.zip
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Compile Tweak Binary
        run: |
          export THEOS=~/theos
          cd ImGui-AdvancedModMenu/ImGui-ModMenu
          $THEOS/bin/make package FINALPACKAGE=1
