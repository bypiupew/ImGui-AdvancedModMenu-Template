steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Theos
    uses: Randomblock1/theos-action@v1

  - name: Diagnose and remove conflicting initializer_list
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Repository root ==="
      pwd

      echo "=== Find initializer_list files ==="
      find . -iname 'initializer_list' -print

      echo "=== Remove project-local conflicting copies ==="
      find . -type f -path '*/IMGUI/initializer_list' -print -delete

      echo "=== Verify removal ==="
      if find . -type f -path '*/IMGUI/initializer_list' -print -quit | grep -q .; then
        echo "ERROR: A conflicting file remains."
        exit 1
      fi

      echo "=== Verify expected ImGui header ==="
      find . -type f -name imgui.h -print

      echo "=== Check project Makefiles ==="
      find . -name Makefile -not -path '*/.theos/*' -print

      echo "=== Git status ==="
      git status --short

  - name: Locate project directory
    shell: bash
    run: |
      set -euo pipefail

      PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"

      if [ ! -f "$PROJECT_DIR/Makefile" ]; then
        echo "ERROR: Expected Makefile not found: $PROJECT_DIR/Makefile"
        echo "Available Makefiles:"
        find . -name Makefile -not -path '*/.theos/*' -print
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build tweak
    shell: bash
    run: |
      set -euo pipefail

      cd "$PROJECT_DIR"

      echo "=== Check conflicting file before build ==="
      if [ -f IMGUI/initializer_list ]; then
        echo "ERROR: IMGUI/initializer_list still exists."
        exit 1
      fi

      echo "=== Clean ==="
      make clean

      echo "=== Build package ==="
      make package FINALPACKAGE=1

  - name: Upload packages
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: ImGui-ModMenu-packages
      path: |
        **/packages/*.deb
      if-no-files-found: warn
