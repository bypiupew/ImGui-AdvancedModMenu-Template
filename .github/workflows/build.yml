
name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Project
        run: |
          echo "=== Repository root ==="
          ls -la

          echo "=== Project directory ==="
          find ImGui-Advanced-ModMenu -maxdepth 3 -type f

          echo "=== Find Makefiles ==="
          find . -name Makefile -not -path './.git/*'

          echo "=== Xcode version ==="
          xcodebuild -version

          echo "=== Xcode project schemes ==="
          xcodebuild -list -project \
            "ImGui-Advanced-ModMenu.xcodeproj"
