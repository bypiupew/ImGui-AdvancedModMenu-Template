steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Theos
    uses: Randomblock1/theos-action@v1

  - name: Remove conflicting initializer_list file
    run: |
      find . -type f -path '*/IMGUI/initializer_list' -print -delete

      echo "Checking for remaining conflicting files..."
      if find . -type f -path '*/IMGUI/initializer_list' -print -quit | grep -q .; then
        echo "ERROR: Conflicting initializer_list file still exists."
        exit 1
      else
        echo "No conflicting initializer_list files found."
      fi

  - name: Locate Makefile
    run: |
      find . -name Makefile -not -path '*/.theos/*' -print

  - name: Build tweak
    shell: bash
    run: |
      set -euo pipefail

      PROJECT_DIR="ImGui-Advanced-ModMenu/ImGui-ModMenu"

      if [ ! -f "$PROJECT_DIR/Makefile" ]; then
        echo "ERROR: Makefile not found at $PROJECT_DIR/Makefile"
        echo "Check the repository directory structure above."
        exit 1
      fi

      cd "$PROJECT_DIR"
      make clean
      make package FINALPACKAGE=1

  - name: Upload build packages
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: ImGui-ModMenu-packages
      path: |
        ImGui-Advanced-ModMenu/ImGui-ModMenu/packages/*.deb
        ImGui-Advanced-ModMenu/ImGui-ModMenu/packages/*.dylib
      if-no-files-found: warn
