
name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project
        run: |
          echo "=== Repository files ==="
          ls -la

          echo "=== Project files ==="
          find ImGui-Advanced-ModMenu -maxdepth 4 -type f

      - name: List Xcode Schemes
        run: |
          xcodebuild -list \
            -project "ImGui-Advanced-ModMenu.xcodeproj"

      - name: Build Xcode Project
        run: |
          xcodebuild \
            -project "ImGui-Advanced-ModMenu.xcodeproj" \
            -scheme "ImGui-Advanced-ModMenu" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ModMenu-Build
          path: |
            ${{ runner.temp }}/Build/Build/Products/Release/**/*.app
            ${{ runner.temp }}/Build/Build/Products/Release/**/*.dylib
            ${{ runner.temp }}/Build/Build/Products/Release/**/*.deb
          if-no-files-found: error
          retention-days: 7
