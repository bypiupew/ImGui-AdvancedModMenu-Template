
name: Build iOS Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          brew install ldid xz

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download SDK Repository
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/sdks"

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_SOURCE="$RUNNER_TEMP/sdks"
          SDK_NAME="iPhoneOS16.5.sdk"

          if [ ! -d "$SDK_SOURCE/$SDK_NAME" ]; then
            echo "SDK not found: $SDK_NAME"
            echo "Available SDKs:"
            find "$SDK_SOURCE" -maxdepth 1 \
              -type d -name 'iPhoneOS*.sdk'
            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          cp -R "$SDK_SOURCE/$SDK_NAME" \
            "$THEOS/sdks/"

          echo "Installed SDK: $SDK_NAME"

      - name: Build Theos Tweak
        shell: bash
        run: |
          set -euo pipefail

          cd ImGui-Advanced-ModMenu/ImGui-ModMenu

          echo "=== Project files ==="
          ls -la

          echo "=== Build ==="
          make clean package FINALPACKAGE=1

      - name: Locate Build Outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Generated packages and libraries ==="

          find .theos packages -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -print 2>/dev/null || true

      - name: Collect Build Artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/artifacts"

          find .theos packages -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -exec cp -f {} "$RUNNER_TEMP/artifacts/" \; \
            2>/dev/null || true

          if [ -z "$(find "$RUNNER_TEMP/artifacts" \
            -type f -print -quit)" ]; then
            echo "No build artifacts found."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/artifacts"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ModMenu-Build
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 7
