name: ImGui Mod Menu Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imgui-mod-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository information
        run: |
          set -eu
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          set -eu
          brew install make ldid

      - name: Install Theos
        run: |
          set -eu
          git clone --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Verify Theos vendor tools
        run: |
          set -eu
          echo "Theos root: $THEOS"
          ls -la "$THEOS/vendor/"
          if [ ! -f "$THEOS/vendor/dm.pl/dm.pl" ]; then
            echo "::error::dm.pl not found at $THEOS/vendor/dm.pl/dm.pl"
            find "$THEOS" -name "dm.pl" 2>/dev/null || echo "dm.pl not found anywhere under THEOS"
            exit 1
          fi
          echo "dm.pl confirmed at $THEOS/vendor/dm.pl/dm.pl"

      - name: Locate project
        id: locate
        run: |
          set -eu

          MAKEFILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name Makefile \
            -not -path '*/.theos/*' \
            -print -quit)"

          if [ -z "$MAKEFILE" ]; then
            echo "::error::No Makefile found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MAKEFILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"
          echo "Makefile: $MAKEFILE"

      - name: Check ImGui files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -eu

          if [ ! -f IMGUI/imgui.h ]; then
            echo "::error::IMGUI/imgui.h was not found."
            exit 1
          fi

          echo "ImGui header found."

          if [ -f IMGUI/initializer_list ]; then
            echo "Removing conflicting bundled IMGUI/initializer_list file."
            rm IMGUI/initializer_list
          fi

      - name: Debug dm.pl execution
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -eu
          echo "=== THEOS env ==="
          echo "THEOS=$THEOS"

          echo "=== dm.pl location ==="
          find "$THEOS" -name "dm.pl" 2>/dev/null

          echo "=== dm.pl permissions ==="
          ls -la "$THEOS/vendor/dm.pl/dm.pl" 2>/dev/null || echo "not at expected path"

          echo "=== Perl location ==="
          which perl || echo "perl not in PATH"
          perl --version 2>/dev/null | head -1

          echo "=== dm.pl shebang ==="
          head -1 "$THEOS/vendor/dm.pl/dm.pl" 2>/dev/null || echo "cant read file"

          echo "=== dm.pl dry run ==="
          perl "$THEOS/vendor/dm.pl/dm.pl" 2>/dev/null || echo "dm.pl exit: $?"

          echo "=== deb.mk check line ==="
          grep -n "dm.pl" "$THEOS/makefiles/package/deb.mk" | head -10

          echo "=== make variables ==="
          make -n package FINALPACKAGE=1 2>&1 | head -30

      - name: Build Debian package
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"

          make clean
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload Debian package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImGui-ModMenu-deb
          path: |
            **/*.deb
          if-no-files-found: error
