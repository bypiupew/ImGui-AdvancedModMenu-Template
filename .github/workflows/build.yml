name: ImGui Mod Menu Build

on: push: pull_request: workflow_dispatch:

permissions: contents: read

jobs: verify-workflow: name: Verify GitHub Actions runs-on: macos-15

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Confirm workflow is running
    run: |
      echo "GitHub Actions is working."
      echo "Repository: $GITHUB_REPOSITORY"
      echo "Branch: $GITHUB_REF_NAME"
      echo "Commit: $GITHUB_SHA"

  - name: Locate Theos project
    run: |
      set -eu
      echo "Searching for Makefiles..."
      find . -type f -name Makefile -not -path '*/.theos/*' -print
      echo "Searching for ImGui headers..."
      find . -type f -name imgui.h -print
